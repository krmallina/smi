name: ML Model Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1-5'  # 3 AM PST (11 AM UTC) Monday-Friday

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    concurrency:
      group: ml-model-build
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for commit amending

      - name: Checkout private scripts repository
        uses: actions/checkout@v4
        with:
          repository: krmallina/scripts
          path: scripts-repo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            stocks
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts-repo/stocks/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts-repo/stocks/requirements.txt ]; then 
            pip install -r scripts-repo/stocks/requirements.txt
          else 
            pip install yfinance pandas requests
          fi

      - name: Run ML model training
        run: python scripts-repo/stocks/ml_predictor.py

      - name: Deploy model files (amend last commit - no new history)
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage only model files
          git add data/ml_models/
          git add data/stock_cache/
          
          if git diff --staged --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          
          # Check if last commit was an auto-update
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_COMMIT_MSG" == *"Deploy ML models - auto-updated"* ]]; then
            # Amend the existing auto-update commit
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit --amend -m "Deploy ML models - auto-updated: $TIMESTAMP [skip ci]"
            git push --force-with-lease origin main
            echo "✓ Amended existing ML models commit (no new history)"
          else
            # First time or manual commits in between - create new commit
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Deploy ML models - auto-updated: $TIMESTAMP [skip ci]"
            git push origin main
            echo "✓ Created new ML models commit"
          fi
